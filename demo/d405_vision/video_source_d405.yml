# XRoboToolkit Unity Client Remote Vision profiles.
# REALSENSE_D405 uses two identical monocular eye views generated by
# d405_vision_sender.py, so it remains compatible with the APK's stereo shader.
- name: "REALSENSE_D405"
  camera: "REALSENSE_D405"
  description: "Intel RealSense D405 low-latency mono view (duplicated stereo)"
  properties:
    - name: "visibleRatio"
      type: "float"
      value: 0.439464
    - name: "contentRatio"
      type: "float"
      value: 1.704850
    - name: "heightCompressionFactor"
      type: "float"
      value: 1.777778
    - name: "RawImageRectSize"
      type: "string"
      value: "600x168.75"
    - name: "CamWidth"
      type: "int"
      value: 2560
    - name: "CamHeight"
      type: "int"
      value: 720
    - name: "CamFPS"
      type: "int"
      value: 30
    - name: "CamBitrate"
      type: "int"
      value: 4000000

